<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flora &amp; Object Lens — Detector</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ====== NAVBAR ====== -->
  <nav class="navbar">
    <div class="nav-brand">
      <span class="brand-icon">🌿</span>
      <span class="brand-name">Flora &amp; Object Lens</span>
    </div>
    <div class="nav-actions">
      <span class="nav-badge" id="cameraStatus">⏳ Tidak ada kamera</span>
      <button class="btn-ghost" id="btnSettings">⚙️ Pengaturan</button>
    </div>
  </nav>

  <!-- ====== MAIN CONTENT ====== -->
  <main class="container">

    <!-- Kategori -->
    <div class="category-tabs">
      <button class="tab active" data-tab="plants">🌱 Tumbuhan</button>
      <button class="tab" data-tab="objects">📦 Benda</button>
      <button class="tab" data-tab="fruits">🍎 Buah</button>
    </div>

    <!-- Preview Area -->
    <div class="preview-area">
      <div class="camera-view" id="cameraView">
        <video id="video" autoplay playsinline></video>
        <div class="overlay">
          <div class="overlay-text">
            <span id="scanLine"></span>
            <p>Kan kamera arahkan objek / tumbuhan</p>
          </div>
          <div class="scan-line" id="scanLine"></div>
        </div>
        <div class="placeholder" id="placeholder">
          <span class="placeholder-icon">📷</span>
          <p>Arahkan objek ke kamera</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="btn-primary" id="btnStart">▶️ Mulai Kamera</button>
        <button class="btn-secondary" id="btnCapture" disabled>⬜ Ambil Gambar</button>
        <button class="btn-secondary" id="btnClear" disabled>✕ Hapus</button>
        <button class="btn-tertiary" id="btnGallery">🖼️ Galeri</button>
      </div>

      <!-- Result -->
      <div class="result-card" id="resultCard">
        <div class="result-header">
          <span class="result-title">Hasil Deteksi</span>
          <span class="result-status" id="detectionStatus">Tunggu...</span>
        </div>
        <div class="result-body">
          <div class="result-image" id="resultImage"></div>
          <div class="result-details" id="resultDetails">
            <div class="detail-row">
              <span class="detail-label">Nama</span>
              <span class="detail-value" id="detailName">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Jenis</span>
              <span class="detail-value" id="detailType">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Kelas</span>
              <span class="detail-value" id="detailClass">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Tingkat Kepercayaan</span>
              <span class="detail-value" id="detailConfidence">—</span>
            </div>
          </div>
        </div>
        <div class="result-footer">
          <div class="tags" id="resultTags"></div>
          <button class="btn-ghost" id="btnFavourite" disabled>⭐ Simpan Favorit</button>
        </div>
      </div>
    </div>

    <!-- Gallery -->
    <div class="gallery" id="gallery">
      <div class="gallery-header">
        <h3>🖼️ Galeri Deteksi</h3>
        <span class="gallery-count" id="galleryCount">0 item</span>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>

  </main>

  <!-- ====== MODAL PENGGANTIAN ====== -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚙️ Pengaturan</h2>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <label for="themeSelect">Tema</label>
          <select id="themeSelect">
            <option value="forest">Hutan</option>
            <option value="ocean">Laut</option>
            <option value="sunset">Terbenam</option>
            <option value="minimal">Minimalis</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="voiceSelect">Suara pembaca (TTS)</label>
          <select id="voiceSelect">
            <option value="none">Tidak ada</option>
            <option value="en-US">English (US)</option>
            <option value="id-ID">Indonesia</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="sensitivityRange">Sensitivitas deteksi</label>
          <input type="range" id="sensitivityRange" min="1" max="10" value="5" />
        </div>
        <div class="setting-item">
          <label for="showSpecs">Tampilkan spesifikasi detail</label>
          <input type="checkbox" id="showSpecs" checked />
        </div>
        <div class="setting-item">
          <label for="logLevel">Tingkat log</label>
          <select id="logLevel">
            <option value="info">Info</option>
            <option value="debug">Debug</option>
            <option value="warn">Peringatan</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="modalCancel">Batal</button>
        <button class="btn-primary" id="modalSave">Simpan</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
  <script src="app.js"></script>
</body>
</html>
